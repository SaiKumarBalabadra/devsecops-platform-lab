<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Platform Service</title>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color: #e8edf5; background: #101827; }
      body { max-width: 850px; margin: 4rem auto; padding: 0 1.25rem; }
      header, section { border: 1px solid #344257; border-radius: .75rem; padding: 1.25rem; margin: 1rem 0; }
      h1 { margin-top: 0; } .status { color: #63dda3; font-weight: 700; }
      code { color: #9cc5ff; } dt { font-weight: 700; } dd { margin: 0 0 .75rem; }
      a { color: #9cc5ff; }
    </style>
  </head>
  <body>
    <header>
      <h1>Platform Service</h1>
      <p>Small operational reference service for Kubernetes and DevSecOps workflows.</p>
      <p>Service status: <span id="status" class="status">checking…</span></p>
    </header>
    <section>
      <h2>Application information</h2>
      <dl id="info"><dt>Loading</dt><dd>Please wait…</dd></dl>
      <p><a href="/health">Health</a> · <a href="/ready">Readiness</a> · <a href="/metrics">Metrics</a></p>
    </section>
    <script>
      async function refresh() {
        const status = document.querySelector("#status");
        const info = document.querySelector("#info");
        try {
          const [health, detail] = await Promise.all([
            fetch("/health").then((response) => response.json()),
            fetch("/api/v1/info").then((response) => response.json())
          ]);
          status.textContent = `${health.status} · uptime ${health.uptime_seconds}s`;
          info.replaceChildren();
          for (const [label, value] of Object.entries(detail)) {
            const term = document.createElement("dt");
            const description = document.createElement("dd");
            term.textContent = label;
            description.textContent = value;
            info.append(term, description);
          }
        } catch {
          status.textContent = "unavailable";
        }
      }
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
