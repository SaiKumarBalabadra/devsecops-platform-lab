name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest
      - run: ruff check app tests
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.1
      - run: helm lint kubernetes/helm/devsecops-platform -f kubernetes/helm/devsecops-platform/values-dev.yaml
      - run: helm template platform-demo kubernetes/helm/devsecops-platform -f kubernetes/helm/devsecops-platform/values-dev.yaml > /tmp/rendered.yaml
      - run: terraform fmt -check -recursive terraform

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Normalize image repository
        run: echo "repository=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build immutable commit-tagged image
        run: docker build -f docker/Dockerfile -t "${{ steps.image.outputs.repository }}:${GITHUB_SHA}" .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Authenticate and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          docker push "${{ steps.image.outputs.repository }}:${GITHUB_SHA}"
      - name: Promote immutable image to development
        run: |
          bash scripts/promote.sh dev "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/helm/devsecops-platform/values-dev.yaml
          if git diff --cached --quiet; then
            echo "Development already references this image tag."
          else
            git commit -m "chore(gitops): promote ${GITHUB_SHA} to dev"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
