apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo-dev
  namespace: argocd
spec:
  project: platform-demo
  source:
    repoURL: https://github.com/ORG/REPOSITORY.git
    targetRevision: main
    path: kubernetes/helm/devsecops-platform
    helm:
      valueFiles: [values.yaml, values-dev.yaml]
      parameters:
        - name: image.repository
          value: ghcr.io/ORG/REPOSITORY
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
