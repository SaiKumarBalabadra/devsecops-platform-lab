apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-demo
  namespace: argocd
spec:
  description: Platform demo workloads
  sourceRepos:
    - https://github.com/ORG/REPOSITORY.git
  destinations:
    - namespace: platform-demo-dev
      server: https://kubernetes.default.svc
    - namespace: platform-demo-staging
      server: https://kubernetes.default.svc
    - namespace: platform-demo-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
