replicaCount: 2
image:
  tag: "0.1.0"
config:
  appEnv: staging
  logLevel: INFO
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
podDisruptionBudget:
  enabled: true
  minAvailable: 1
quota:
  enabled: true
  requestsCpu: "4"
  requestsMemory: 4Gi
  limitsCpu: "8"
  limitsMemory: 8Gi
  pods: "20"
limitRange:
  enabled: true
