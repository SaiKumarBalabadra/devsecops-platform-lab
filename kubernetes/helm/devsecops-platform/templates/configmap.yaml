apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devsecops-platform.fullname" . }}
  labels:
    {{- include "devsecops-platform.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  GIT_COMMIT: {{ .Values.config.gitCommit | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
