apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-diagnostics-reader
  namespace: platform-demo-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-diagnostics-readers
  namespace: platform-demo-dev
subjects:
  - kind: Group
    name: platform-operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-diagnostics-reader
  apiGroup: rbac.authorization.k8s.io
